name: Luxicon
options:
  bundleIdPrefix: edu.davidson
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
packages:
  Luxicon:
    path: ..
settings:
  base:
    # One version train for the app and every extension: App Store validation
    # rejects uploads whose extension CFBundleVersion differs from the app's.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 17
targets:
  Luxicon:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - Shared
      - Assets.xcassets
      - Resources
    dependencies:
      - package: Luxicon
        product: LuxiconKit
      - target: LuxiconWidgets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Luxicon
        # xcodegen defaults this to 1.0 and ignores MARKETING_VERSION unless
        # referenced explicitly; ASC's version train is 1.0 as a result.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: >-
          Luxicon records your 1-on-1 meetings so it can transcribe them.
          All processing happens on this device; audio never leaves your phone.
        NSLocalNetworkUsageDescription: >-
          Luxicon uses the local network only if you set up Mac sync: to find
          your Mac and send it the transcripts you choose to sync, and, only when you
          tap Send My Voice to Mac, your voice fingerprint. Without Mac
          sync, the local network is never used.
        NSBonjourServices:
          - _luxicon._tcp
        UIBackgroundModes: [audio]
        # Continuous background tasks (iOS 26+) require a wildcard identifier:
        # bundle ID + semantic context + ".*"; each submission appends a
        # unique suffix (see ContinuedProcessing.swift).
        BGTaskSchedulerPermittedIdentifiers:
          - edu.davidson.luxicon.processing.*
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: edu.davidson.luxicon
            CFBundleURLSchemes: [luxicon]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.davidson.luxicon
        DEVELOPMENT_TEAM: 4Z539UE4TT
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Luxicon.entitlements
  LuxiconWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Widgets
      - Shared
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Luxicon
        # Match the parent app's versions; App Store validation rejects
        # extensions whose CFBundleVersion differs (xcodegen defaults to 1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.davidson.luxicon.widgets
        DEVELOPMENT_TEAM: 4Z539UE4TT
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
  LuxiconMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      # Shares the iOS app's sources minus the iOS-only entry point, system
      # integrations (BackgroundTasks, ActivityKit, App Intents), and phone
      # navigation shell. Mac-only code lives in MacSources.
      - path: Sources
        excludes:
          - LuxiconApp.swift
          - ContinuedProcessing.swift
          - RecordingActivityController.swift
          - LuxiconIntents.swift
          - Views/PeopleListView.swift
          - Views/PersonDetailView.swift
          - Views/OnboardingView.swift
          - Views/QuickRecordPickerView.swift
          - Views/RecordSheetView.swift
      - MacSources
      - Assets.xcassets
      - Resources
    dependencies:
      - package: Luxicon
        product: LuxiconKit
    info:
      path: MacInfo.plist
      properties:
        CFBundleDisplayName: Luxicon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: >-
          Luxicon records your 1-on-1 meetings so it can transcribe them.
          All processing happens on this Mac; audio never leaves it.
    settings:
      base:
        PRODUCT_NAME: Luxicon
        PRODUCT_BUNDLE_IDENTIFIER: edu.davidson.luxicon.mac
        DEVELOPMENT_TEAM: 4Z539UE4TT
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        # Developer ID (direct distribution, no provisioning profile) for
        # every configuration, so local builds carry the same signature
        # shape as the notarized release.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_ENTITLEMENTS: LuxiconMac.entitlements
